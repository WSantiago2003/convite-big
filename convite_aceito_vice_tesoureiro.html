<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Aceita! | Vice-Tesoureiro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti para efeitos comemorativos suaves -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Tone.js para efeitos sonoros comemorativos sem depender de arquivos externos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: Playfair Display (elegante) e Plus Jakarta Sans (moderna) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            900: '#09111E',
                            800: '#0F1C30',
                            700: '#162844',
                        },
                        gold: {
                            300: '#FDE68A',
                            400: '#FBBF24',
                            500: '#D97706',
                            600: '#B45309',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-x-hidden relative selection:bg-amber-400 selection:text-navy-900">

    <!-- Canvas de Fundo para Partículas Douradas e Azuis Sutis -->
    <canvas id="particle-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Brilhos Ambientais Decorativos (Glow) -->
    <div class="fixed top-1/4 -left-20 w-72 h-72 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Container Principal -->
    <main class="relative z-10 w-full max-w-xl mx-auto">
        
        <!-- Cartão Centralizado com Efeito Glassmorphism e Borda Dourada Sutil -->
        <div id="celebration-card" class="bg-navy-800/80 backdrop-blur-xl border border-amber-400/30 rounded-3xl p-6 sm:p-10 md:p-12 shadow-2xl shadow-black/60 text-center transition-all duration-500 transform hover:border-amber-400/50">
            
            <!-- Selo Simbólico de Parceria & Liderança -->
            <div class="inline-flex flex-col items-center mb-6 sm:mb-8">
                <div class="relative flex items-center justify-center w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-br from-amber-300 via-amber-500 to-amber-700 p-0.5 shadow-lg shadow-amber-500/25">
                    <div class="w-full h-full bg-navy-900 rounded-full flex items-center justify-center relative overflow-hidden">
                        <!-- Brilho interno do selo -->
                        <div class="absolute inset-0 bg-gradient-to-tr from-blue-500/10 to-amber-400/20"></div>
                        <!-- Ícone SVG Personalizado: Escudo de Liderança & Aliança -->
                        <svg class="w-10 h-10 sm:w-12 sm:h-12 text-amber-400 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" class="fill-amber-400/10"/>
                            <path d="M8 11l3 3 5-5" stroke="#FBBF24" stroke-width="2.2"/>
                            <circle cx="12" cy="6" r="1" fill="#60A5FA" stroke="none"/>
                        </svg>
                    </div>
                </div>
                <span class="mt-3 px-3.5 py-1 rounded-full text-xs font-semibold tracking-widest uppercase bg-amber-400/10 text-amber-300 border border-amber-400/20">
                    Parceria &amp; Liderança
                </span>
            </div>

            <!-- Linha Divisória Ornamental -->
            <div class="flex items-center justify-center gap-3 mb-6 opacity-70">
                <div class="h-px w-12 bg-gradient-to-r from-transparent to-amber-400/60"></div>
                <span class="text-amber-400 text-xs">✦</span>
                <div class="h-px w-12 bg-gradient-to-l from-transparent to-amber-400/60"></div>
            </div>

            <!-- Mensagem Principal Exata em Destaque -->
            <h1 class="font-serif text-2xl sm:text-4xl md:text-[2.5rem] font-bold leading-snug sm:leading-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-100 via-white to-amber-200 mb-6 px-1">
                “Big, eu aceito o convite para ser seu vice tesoureiro.”
            </h1>

            <!-- Subtexto Acolhedor -->
            <p class="text-slate-300 text-sm sm:text-base leading-relaxed max-w-md mx-auto mb-8 sm:mb-10 font-normal">
                Conte comigo nessa jornada! Juntos vamos cuidar de cada detalhe com transparência, dedicação e muita parceria.
            </p>

            <!-- Botão Interativo de Celebrar -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="celebrate-btn" type="button" class="group relative w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-4 rounded-2xl font-semibold text-navy-900 bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 hover:from-amber-200 hover:to-amber-400 active:scale-95 transition-all duration-200 shadow-lg shadow-amber-500/25 cursor-pointer">
                    <!-- Ícone de Festa / Estrelas -->
                    <svg class="w-5 h-5 text-navy-900 transition-transform duration-300 group-hover:rotate-12 group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5.8 11.3 2 22l10.7-3.79"/>
                        <path d="M4 3h.01"/>
                        <path d="M22 8h.01"/>
                        <path d="M15 2h.01"/>
                        <path d="M22 20h.01"/>
                        <path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/>
                        <path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/>
                        <path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/>
                        <path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/>
                    </svg>
                    <span class="text-base tracking-wide">Celebrar</span>
                </button>
            </div>

            <!-- Feedback Visual Sutil ao Clicar -->
            <div id="toast-feedback" class="mt-5 h-6 flex items-center justify-center opacity-0 transition-opacity duration-300">
                <span class="text-xs sm:text-sm font-medium text-amber-300/90 flex items-center gap-1.5">
                    <span>✨</span> Vamos fazer um excelente trabalho juntos!
                </span>
            </div>

        </div>

        <!-- Rodapé Discreto -->
        <footer class="mt-6 text-center text-xs text-slate-400/70">
            Compromisso firmado • Gestão &amp; Confiança
        </footer>
    </main>

    <script>
        /**
         * 1. SISTEMA DE PARTÍCULAS SUAVES NO FUNDO (DOURADO E AZUL)
         * Cria um ambiente acolhedor e elegante no canvas de fundo.
         */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class AmbientParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = -(Math.random() * 0.4 + 0.15);
                this.speedX = (Math.random() - 0.5) * 0.3;
                // Alterna entre tons dourados e azul-celeste suaves
                const isGold = Math.random() > 0.35;
                this.color = isGold 
                    ? `rgba(251, 191, 36, ${Math.random() * 0.45 + 0.15})` 
                    : `rgba(96, 165, 250, ${Math.random() * 0.4 + 0.15})`;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < -10) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            resizeCanvas();
            particles = [];
            const count = Math.min(Math.floor((canvas.width * canvas.height) / 14000), 85);
            for (let i = 0; i < count; i++) {
                particles.push(new AmbientParticle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            animationFrameId = requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            initParticles();
        });

        /**
         * 2. EFEITO SONORO COMEMORATIVO SINTETIZADO (TONE.JS)
         * Toca um acorde festivo brilhante e elegante ao clicar em "Celebrar".
         */
        let synth = null;

        async function playCelebrationSound() {
            try {
                if (typeof Tone === 'undefined') return;
                await Tone.start();

                if (!synth) {
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'triangle' },
                        envelope: {
                            attack: 0.03,
                            decay: 0.3,
                            sustain: 0.2,
                            release: 1.4
                        }
                    }).toDestination();
                    synth.volume.value = -8;
                }

                const now = Tone.now();
                // Arpejo maior ascendente alegre e sofisticado (Dó Maior com 9ª)
                synth.triggerAttackRelease('C5', '8n', now);
                synth.triggerAttackRelease('E5', '8n', now + 0.08);
                synth.triggerAttackRelease('G5', '8n', now + 0.16);
                synth.triggerAttackRelease(['B5', 'D6'], '2n', now + 0.25);
            } catch (err) {
                console.warn('Áudio não pôde ser reproduzido automaticamente:', err);
            }
        }

        /**
         * 3. DISPARO DE CONFETES DOURADOS E AZUIS
         */
        function triggerConfetti(intensity = 'normal') {
            if (typeof confetti === 'undefined') return;

            const colors = ['#FBBF24', '#FDE68A', '#3B82F6', '#93C5FD', '#FFFFFF'];

            if (intensity === 'burst') {
                // Disparo central vibrante
                confetti({
                    particleCount: 90,
                    spread: 75,
                    origin: { y: 0.6 },
                    colors: colors,
                    scalar: 1.05
                });

                // Disparos laterais sincronizados
                setTimeout(() => {
                    confetti({
                        particleCount: 45,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0, y: 0.65 },
                        colors: colors
                    });
                    confetti({
                        particleCount: 45,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1, y: 0.65 },
                        colors: colors
                    });
                }, 180);
            } else {
                // Boas-vindas suaves ao abrir a página
                confetti({
                    particleCount: 55,
                    spread: 70,
                    origin: { y: 0.55 },
                    colors: colors,
                    disableForReducedMotion: true
                });
            }
        }

        /**
         * 4. INTERATIVIDADE DO CARTÃO E BOTÃO
         */
        const celebrateBtn = document.getElementById('celebrate-btn');
        const card = document.getElementById('celebration-card');
        const toastFeedback = document.getElementById('toast-feedback');
        let toastTimeout;

        celebrateBtn.addEventListener('click', () => {
            // Dispara confetes extras
            triggerConfetti('burst');
            
            // Toca som comemorativo
            playCelebrationSound();

            // Efeito visual de pulso dourado no cartão
            card.classList.add('ring-4', 'ring-amber-400/40', 'scale-[1.01]');
            setTimeout(() => {
                card.classList.remove('ring-4', 'ring-amber-400/40', 'scale-[1.01]');
            }, 450);

            // Exibe mensagem de confirmação sutil
            toastFeedback.classList.remove('opacity-0');
            toastFeedback.classList.add('opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastFeedback.classList.remove('opacity-100');
                toastFeedback.classList.add('opacity-0');
            }, 3500);
        });

        // Inicialização ao carregar a janela
        window.onload = function () {
            initParticles();
            animateParticles();
            // Pequeno atraso para garantir que o layout esteja visível antes dos confetes iniciais
            setTimeout(() => {
                triggerConfetti('normal');
            }, 400);
        };
    </script>
</body>
</html>
